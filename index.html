<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
<title>Learn Diabetes</title> 
 
<style> 
* { 
    box-sizing: border-box; 
} 
 
body { 
    margin: 0; 
    background: white; 
    font-family: Arial, sans-serif; 
} 
 
.banner { 
    height: 85px; 
    background: #7b4bb7; 
    display: flex; 
    align-items: center; 
    padding-left: 18px; 
} 
 
.banner img { 
    height: 62px; 
    width: auto; 
    display: block; 
} 
 
.home { 
    max-width: 650px; 
    margin: 25px auto; 
    padding: 0 15px; 
} 
 
.buttons { 
    display: flex; 
    flex-direction: column; 
    gap: 14px; 
} 
 
.buttons a { 
    display: block; 
    width: 100%; 
} 
 
.buttons img { 
    width: 100%; 
    height: auto; 
    display: block; 
    cursor: pointer; 
} 

/* FOOTER */

.footer {
    width: 100%;
    background: #000;
    color: white;
    display: flex;
    align-items: center;
    padding: 30px 35px;
    gap: 70px;
    margin-top: 50px;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
}

.footer-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

.footer-left img {
    width: 160px;
    height: auto;
    display: block;
}

.footer-name {
    width: 160px;
    text-align: center;
    color: white;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 18px;
    margin-top: 7px;
}

.footer-links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.footer-links a {
    color: white;
    text-decoration: none;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
    font-size: 19px;
}

.footer-links a:hover {
    text-decoration: underline;
}
 
/* MOBILE */ 
 
@media (max-width: 600px) { 
 
    .banner { 
        height: 70px; 
        padding-left: 12px; 
    } 
 
    .banner img { 
        height: 50px; 
    } 
 
    .home { 
        width: 100%; 
        max-width: none; 
        margin: 20px auto; 
        padding: 0 10px; 
    } 
 
    .buttons { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 10px; 
    } 
 
    .buttons a { 
        width: 100%; 
    } 
 
    .buttons img { 
        width: 100%; 
        height: auto; 
    } 

    .footer {
        margin-top: 35px;
        padding: 25px 18px;
        gap: 30px;
    }

    .footer-left img {
        width: 120px;
    }

    .footer-name {
        width: 120px;
        font-size: 15px;
    }

    .footer-links {
        gap: 12px;
    }

    .footer-links a {
        font-size: 16px;
    }
 
} 
</style> 
</head> 
 
<body> 
 
<div class="banner"> 
    <img src="home/title.png" alt="Learn Diabetes"> 
</div> 
 
<div class="home"> 
 
    <div class="buttons"> 
 
        <a href="carbhome.html"> 
            <img src="home/1.png" alt="Carb Counting"> 
        </a> 
 
        <a href="understandingdiabetes.html"> 
            <img src="home/2.png" alt="Understanding Diabetes"> 
        </a> 
 
        <a href="living.html"> 
            <img src="home/3.png" alt="Living with Diabetes"> 
        </a> 
 
        <a href="refresher.html"> 
            <img src="home/4.png" alt="Refresher"> 
        </a> 
 
        <a href="timed.html"> 
            <img src="home/5.png" alt="Timed Challenge"> 
        </a> 
 
    </div> 
 
</div> 

<!-- FOOTER -->

<footer class="footer">

    <div class="footer-left">

        <img src="home/footer/footer.png" alt="Learn Diabetes">

        <div class="footer-name">
            Learn Diabetes
        </div>

    </div>

    <div class="footer-links">

        <a href="contact.html">
            Contact Us
        </a>

        <a href="test.html">
            Be a Beta Tester
        </a>

    </div>

</footer>
 
</body> 
</html>
