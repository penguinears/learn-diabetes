<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Carb Counting Timed Challenge</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f5fb;
    color:#29233a;
}

.topbar{
    height:58px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 15px;
}

.back{
    color:#555;
    text-decoration:none;
    font-size:15px;
}

.title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-weight:bold;
    font-size:17px;
}

.page{
    height:calc(100dvh - 58px);
    max-width:850px;
    margin:auto;
    padding:10px;
    display:flex;
    flex-direction:column;
}

.card{
    background:white;
    border-radius:14px;
    padding:14px;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* START */

.start{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.start h1{
    color:#6c3fc5;
    font-size:32px;
    margin:0 0 10px;
}

.start p{
    color:#666;
    font-size:17px;
    margin:5px 0 25px;
}

.time-options{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.time-button{
    border:2px solid #6c3fc5;
    background:white;
    color:#6c3fc5;
    padding:12px 20px;
    border-radius:9px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.time-button.selected{
    background:#6c3fc5;
    color:white;
}

.start-button{
    margin-top:25px;
    border:0;
    background:#6c3fc5;
    color:white;
    padding:13px 35px;
    border-radius:9px;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

/* GAME */

.game{
    display:none;
    flex:1;
    min-height:0;
    flex-direction:column;
}

.game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.timer{
    font-size:27px;
    font-weight:bold;
    color:rgb(76,175,80);
    display:flex;
    align-items:center;
    gap:8px;
}

.timer-icon{
    color:rgb(76,175,80);
    transition:color .25s ease;
}

.score{
    font-size:22px;
    font-weight:bold;
}

.score-number{
    color:#6c3fc5;
}

.question{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin:5px 0 12px;
}

.question span{
    color:#6c3fc5;
}

/* LABEL */

.label{
    width:100%;
    max-width:500px;
    margin:auto;
    border:1px solid #bbb;
    border-radius:8px;
    background:white;
    color:#111;
    padding:15px;
    font-family:Arial,sans-serif;
}

.label-title{
    font-size:24px;
    font-weight:bold;
    border-bottom:7px solid #111;
    padding-bottom:5px;
}

.label-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px solid #aaa;
    font-size:16px;
}

.label-row.big{
    font-size:19px;
    font-weight:bold;
}

.label-row.carbs{
    font-size:21px;
    font-weight:bold;
}

/* ANSWER */

.answer-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:12px 0;
}

.answer{
    width:180px;
    height:52px;
    border:3px solid #6c3fc5;
    border-radius:10px;
    font-size:22px;
    text-align:center;
    outline:none;
}

.answer:focus{
    box-shadow:0 0 0 3px #e8ddfa;
}

.unit{
    font-size:19px;
}

/* FEEDBACK */

.feedback{
    min-height:35px;
    text-align:center;
    font-size:17px;
    font-weight:bold;
    padding:7px;
}

.correct{
    color:#21853a;
}

.wrong{
    color:#b00020;
}

/* CONTROLS */

.controls{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.check{
    border:0;
    background:#6c3fc5;
    color:white;
    font-weight:bold;
    padding:12px 35px;
    border-radius:9px;
    font-size:17px;
    cursor:pointer;
}

/* COMPLETE */

.complete{
    display:none;
    height:100%;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.complete h1{
    color:#6c3fc5;
    font-size:34px;
}

.final-score{
    font-size:28px;
    font-weight:bold;
    margin:15px 0;
}

.final-score span{
    color:#6c3fc5;
}

.play-again{
    border:0;
    background:#6c3fc5;
    color:white;
    padding:13px 30px;
    border-radius:9px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* SCORE ANIMATION */

.score-pop{
    animation:scorePop .35s ease;
}

@keyframes scorePop{
    0%{
        transform:translateY(20px);
        opacity:0;
    }

    60%{
        transform:translateY(-4px);
        opacity:1;
    }

    100%{
        transform:translateY(0);
        opacity:1;
    }
}

/* MOBILE */

@media(max-width:650px){

    .topbar{
        height:54px;
        padding:0 10px;
    }

    .title{
        font-size:16px;
    }

    .page{
        height:calc(100dvh - 54px);
        padding:6px;
    }

    .card{
        padding:8px;
    }

    .start h1{
        font-size:28px;
    }

    .start p{
        font-size:16px;
    }

    .time-button{
        min-width:80px;
        padding:11px 15px;
    }

    .question{
        font-size:21px;
        margin:3px 0 8px;
    }

    .timer{
        font-size:24px;
    }

    .score{
        font-size:20px;
    }

    .label{
        max-width:95%;
        padding:10px;
    }

    .label-title{
        font-size:20px;
    }

    .label-row{
        padding:5px 0;
        font-size:14px;
    }

    .label-row.big{
        font-size:17px;
    }

    .label-row.carbs{
        font-size:18px;
    }

    .answer-area{
        margin:8px 0;
    }

    .answer{
        width:160px;
        height:48px;
        font-size:20px;
    }

    .controls{
        height:50px;
    }

    .check{
        min-height:44px;
        font-size:16px;
    }
}

@media(max-width:650px) and (max-height:650px){

    .question{
        font-size:19px;
    }

    .label{
        padding:7px;
    }

    .label-row{
        padding:3px 0;
    }

    .answer-area{
        margin:5px 0;
    }

    .controls{
        height:45px;
    }
}
</style>
</head>

<body>

<header class="topbar">

<a href="../index.html" class="back">
Back
</a>

<div class="title">
Timed Challenge
</div>

</header>

<main class="page">

<div class="card">

<!-- START SCREEN -->

<div class="start" id="start">

<h1>
Carb Counting Challenge
</h1>

<p>
How many can you get right before time runs out?
</p>

<div class="time-options">

<button class="time-button" data-time="30">
30 seconds
</button>

<button class="time-button" data-time="60">
1 minute
</button>

<button class="time-button selected" data-time="120">
2 minutes
</button>

<button class="time-button" data-time="300">
5 minutes
</button>

</div>

<button class="start-button" id="startButton">
Start Challenge
</button>

</div>

<!-- GAME -->

<div class="game" id="game">

<div class="game-top">

<div class="timer" id="timer">

<i class="fa-solid fa-clock timer-icon"></i>

<span id="timerText">
2:00
</span>

</div>

<div class="score">
Correct:
<span class="score-number" id="score">
0000
</span>
</div>

</div>

<div class="question" id="question">
</div>

<div class="label" id="label">
</div>

<div class="answer-area">

<input
id="answer"
class="answer"
type="number"
step="0.1"
inputmode="decimal"
autocomplete="off"
>

<div class="unit">
g carbs
</div>

</div>

<div
class="feedback"
id="feedback"
>
</div>

</div>

<!-- COMPLETE -->

<div class="complete" id="complete">

<h1>
Time's up!
</h1>

<div class="final-score">
You got
<span id="finalScore">0</span>
correct
</div>

<p>
See if you can beat your score next time.
</p>

<button class="play-again" onclick="location.reload()">
Play Again
</button>

</div>

</div>

<div class="controls" id="controls">

<button
class="check"
id="check"
style="display:none;"
>
Check
</button>

</div>

</main>

<script>

/* FOOD DATABASE */

const foods = [

{
    name:"Apple juice",
    unit:"ml",
    carbs:11
},

{
    name:"Oat milk",
    unit:"ml",
    carbs:6.7
},

{
    name:"Milk",
    unit:"ml",
    carbs:4.8
},

{
    name:"Orange juice",
    unit:"ml",
    carbs:8.7
},

{
    name:"Pasta",
    unit:"g",
    carbs:30
},

{
    name:"Rice",
    unit:"g",
    carbs:28
},

{
    name:"Bread",
    unit:"g",
    carbs:45
},

{
    name:"Potato",
    unit:"g",
    carbs:17
},

{
    name:"Cereal",
    unit:"g",
    carbs:75
},

{
    name:"Ketchup",
    unit:"g",
    carbs:25
}

];


/* VARIABLES */

let selectedTime=120;
let timeLeft=120;
let score=0;
let currentFood;
let portion;
let correctAnswer;
let timerInterval;
let locked=false;


/* ELEMENTS */

const start=document.getElementById("start");
const game=document.getElementById("game");
const complete=document.getElementById("complete");

const timer=document.getElementById("timer");
const timerText=document.getElementById("timerText");
const timerIcon=document.querySelector(".timer-icon");

const scoreDisplay=document.getElementById("score");
const finalScore=document.getElementById("finalScore");

const question=document.getElementById("question");
const label=document.getElementById("label");
const answer=document.getElementById("answer");
const feedback=document.getElementById("feedback");

const startButton=document.getElementById("startButton");
const checkButton=document.getElementById("check");
const controls=document.getElementById("controls");


/* TIME BUTTONS */

document.querySelectorAll(".time-button").forEach(button=>{

    button.onclick=function(){

        document
        .querySelectorAll(".time-button")
        .forEach(b=>b.classList.remove("selected"));

        button.classList.add("selected");

        selectedTime=
            Number(button.dataset.time);

    };

});


/* START */

startButton.onclick=function(){

    timeLeft=selectedTime;
    score=0;

    scoreDisplay.textContent="0000";

    start.style.display="none";

    game.style.display="flex";

    checkButton.style.display="block";

    updateTimer();

    newQuestion();

    timerInterval=setInterval(
        countdown,
        1000
    );

};


/* TIMER */

function countdown(){

    if(timeLeft<=0){
        return;
    }

    timeLeft--;

    updateTimer();

    if(timeLeft<=0){

        endChallenge();

    }

}


function updateTimer(){

    const minutes=
        Math.floor(timeLeft/60);

    const seconds=
        timeLeft%60;

    timerText.textContent=
        minutes+
        ":"+
        String(seconds).padStart(2,"0");


    /*
        51-120 SECONDS = GREEN
        26-50 SECONDS = YELLOW
        0-25 SECONDS = RED
    */

    if(timeLeft>50){

        timerIcon.style.color=
            "rgb(76, 175, 80)";

        timerText.style.color=
            "rgb(76, 175, 80)";

    }else if(timeLeft>25){

        timerIcon.style.color=
            "rgb(212, 175, 55)";

        timerText.style.color=
            "rgb(212, 175, 55)";

    }else{

        timerIcon.style.color=
            "rgb(212, 23, 38)";

        timerText.style.color=
            "rgb(212, 23, 38)";

    }

}


/* RANDOM PORTION */

function randomPortion(food){

    if(food.unit==="ml"){

        const options=[
            50,
            60,
            75,
            80,
            100,
            125,
            150,
            175,
            200,
            250
        ];

        return options[
            Math.floor(
                Math.random()*options.length
            )
        ];

    }

    const options=[
        25,
        40,
        50,
        60,
        75,
        80,
        100,
        120,
        150,
        200
    ];

    return options[
        Math.floor(
            Math.random()*options.length
        )
    ];

}


/* NEW QUESTION */

function newQuestion(){

    if(timeLeft<=0){
        return;
    }

    locked=false;

    answer.value="";

    feedback.textContent="";

    feedback.className="feedback";


    currentFood=
        foods[
            Math.floor(
                Math.random()*foods.length
            )
        ];


    portion=
        randomPortion(currentFood);


    correctAnswer=
        Math.round(
            currentFood.carbs*
            portion/
            100*
            10
        )/10;


    question.innerHTML=
        `Find the carbs for <span>${portion}${currentFood.unit}</span> of <span>${currentFood.name}</span>`;


    label.innerHTML=`

        <div class="label-title">
            ${currentFood.name}
        </div>

        <div class="label-row big">
            <span>Nutrition information</span>
            <span></span>
        </div>

        <div class="label-row">
            <span>Serving size</span>
            <span>100${currentFood.unit}</span>
        </div>

        <div class="label-row carbs">
            <span>Carbohydrate</span>
            <span>${currentFood.carbs}g</span>
        </div>

    `;

    answer.focus();

}


/* CHECK */

checkButton.onclick=function(){

    if(locked || timeLeft<=0){
        return;
    }

    const value=
        parseFloat(answer.value);

    if(isNaN(value)){

        feedback.className="feedback wrong";

        feedback.textContent=
            "Enter an answer first.";

        return;

    }


    if(
        Math.abs(
            value-correctAnswer
        )<0.11
    ){

        correct();

    }else{

        wrong();

    }

};


/* ENTER KEY */

answer.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            checkButton.click();

        }

    }
);


/* CORRECT */

function correct(){

    locked=true;

    score++;

    feedback.className=
        "feedback correct";

    feedback.textContent=
        "Correct!";


    animateScore();


    setTimeout(
        function(){

            if(timeLeft>0){

                newQuestion();

            }

        },
        350
    );

}


/* WRONG */

function wrong(){

    locked=true;

    feedback.className=
        "feedback wrong";

    feedback.textContent=
        "Not quite — the answer was "+
        correctAnswer+
        "g.";


    /*
        WRONG ANSWERS DO NOT
        CHANGE THE SCORE OR TIMER
    */

    setTimeout(
        function(){

            if(timeLeft>0){

                newQuestion();

            }

        },
        700
    );

}


/* SCORE ANIMATION */

function animateScore(){

    scoreDisplay.classList.remove(
        "score-pop"
    );

    void scoreDisplay.offsetWidth;

    scoreDisplay.classList.add(
        "score-pop"
    );

    scoreDisplay.textContent=
        String(score).padStart(4,"0");

}


/* END */

function endChallenge(){

    clearInterval(timerInterval);

    locked=true;

    timeLeft=0;

    updateTimer();

    checkButton.style.display="none";

    game.style.display="none";

    controls.style.display="none";

    complete.style.display="flex";

    finalScore.textContent=score;

}


/* START WITH 2 MINUTES */

selectedTime=120;

updateTimer();

</script>

</body>
</html>
