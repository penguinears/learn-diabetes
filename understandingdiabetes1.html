<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>What Is Diabetes?</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f5fb;
  color:#29233a;
}

.top{
  height:55px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 12px;
}

.back{
  color:#555;
  text-decoration:none;
}

.bar{
  width:50%;
  height:8px;
  background:#eee;
  margin:auto;
  border-radius:10px;
}

.progress{
  height:100%;
  width:0;
  background:#6c3fc5;
  border-radius:10px;
}

.page{
  height:calc(100dvh - 55px);
  max-width:850px;
  margin:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
}

.card{
  background:white;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:8px;
}

.video{
  width:100%;
  height:min(55vh,450px);
  object-fit:contain;
  background:#000;
}

.pool{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:auto;
  gap:10px;
}

.question{
  width:95%;
  max-width:650px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin-bottom:10px;
}

.option{
  width:90%;
  max-width:500px;
  padding:12px;
  font-size:18px;
  text-align:center;
  border:2px solid #6c3fc5;
  border-radius:7px;
  outline:none;
  background:white;
  color:#29233a;
}

.option:active{
  background:#f0eafa;
}

.feedback{
  display:none;
  text-align:center;
  padding:8px;
}

.feedback.red{
  color:#b00020;
}

.feedback.yellow{
  color:#8a6d1b;
}

.feedback.green{
  color:#1b5e20;
}

.controls{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font:inherit;
  cursor:pointer;
}

.mainbtn{
  border:0;
  background:#6c3fc5;
  color:white;
  font-weight:bold;
  padding:11px 28px;
  border-radius:7px;
}

.complete{
  position:fixed;
  inset:0;
  background:#f7f5fb;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

@media(max-width:600px){

  .page{
    padding:5px;
  }

  .video{
    height:min(42vh,280px);
  }

  .question{
    font-size:20px;
  }

  .option{
    padding:10px;
    font-size:17px;
  }

  .mainbtn{
    padding:10px 24px;
  }
}
</style>

</head>

<body>

<header class="top">

<a class="back" href="../index.html">Back</a>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>

</header>

<main class="page" id="lesson">

  <div class="card">

```
<video
  id="video"
  class="video"
  controls
  playsinline
  preload="metadata">
  <source src="videos/0919 (1).mp4" type="video/mp4">
</video>

<div id="pool" class="pool"></div>

<div id="feedback" class="feedback"></div>
```

  </div>

  <div class="controls">

```
<button
  id="continue"
  class="mainbtn">
  Continue
</button>
```

  </div>

</main>

<section
  id="complete"
  class="complete"
  style="display:none">

  <div>

```
<h1>Lesson complete</h1>

<p>Great work!</p>
```

  </div>

</section>

<script>

const lessons = [

  {
    type:"video"
  },

  {
    type:"question",
    question:"What do you need energy for?",
    options:[
      "To play",
      "To learn",
      "To grow",
      "All the above and everything else you do!"
    ],
    answer:3
  },

  {
    type:"question",
    question:"Where is insulin made?",
    options:[
      "The stomach",
      "The pancreas",
      "The liver",
      "The heart"
    ],
    answer:1
  },

  {
    type:"question",
    question:"What do we do to food when we eat it?",
    options:[
      "Turn it into water",
      "Turn it into glucose and other things our body can use",
      "Turn it straight into energy",
      "Keep it exactly the same"
    ],
    answer:1
  },

  {
    type:"question",
    question:"Is Type 1 diabetes caused by eating too much sugar?",
    options:[
      "Yes",
      "NOOO!!!!"
    ],
    answer:1
  }

];


let n = 0;
let locked = false;

const $ = id => document.getElementById(id);


function load(){

  locked = false;

  $("feedback").style.display = "none";
  $("feedback").textContent = "";

  $("progress").style.width =
    (n / lessons.length * 100) + "%";

  $("pool").innerHTML = "";

  $("continue").style.display = "block";


  if(lessons[n].type === "video"){

    $("video").style.display = "block";

  }else{

    $("video").style.display = "none";

    loadQuestion();

  }

}


function loadQuestion(){

  let x = lessons[n];

  let question =
    document.createElement("div");

  question.className = "question";
  question.textContent = x.question;

  $("pool").appendChild(question);


  x.options.forEach((option,index) => {

    let button =
      document.createElement("button");

    button.className = "option";
    button.textContent = option;

    button.onclick = () => {

      if(locked)
        return;

      if(index === x.answer){

        correctAdvance();

      }else{

        showFeedback(
          "red",
          "Not quite. Try again."
        );

      }

    };

    $("pool").appendChild(button);

  });

}


function showFeedback(type,text){

  $("feedback").className =
    "feedback " + type;

  $("feedback").textContent = text;

  $("feedback").style.display = "block";

}


function correctAdvance(){

  locked = true;

  showFeedback(
    "green",
    "Correct!"
  );

  setTimeout(() => {

    n++;

    if(n >= lessons.length){

      finish();
      return;

    }

    load();

  },600);

}


$("continue").onclick = () => {

  if(locked)
    return;

  n++;

  if(n >= lessons.length){

    finish();
    return;

  }

  load();

};


function finish(){

  $("lesson").style.display = "none";

  $("complete").style.display = "flex";

  $("progress").style.width = "100%";

}


load();

</script>

</body>
</html>
