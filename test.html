
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Beta Tester</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
}

body{
    background:white;
    font-family:"Comic Sans MS","Comic Sans",cursive;
    overflow-x:hidden;
}

/* =========================
   CALCULATOR BUTTON
========================= */

.calc-button{
    position:fixed;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:#48b8b2;
    border:0;
    color:white;
    font-size:25px;
    cursor:pointer;
    z-index:1000;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
}

/* =========================
   CALCULATOR
========================= */

.calculator{
    position:fixed;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:255px;
    background:#222;
    border-radius:16px;
    padding:12px;
    display:none;
    z-index:999;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
    cursor:grab;
    user-select:none;
}

.calculator.dragging{
    cursor:grabbing;
}

.display{
    width:100%;
    height:55px;
    background:#eee;
    border:0;
    border-radius:9px;
    margin-bottom:10px;
    padding:8px 10px;
    font-family:Arial,sans-serif;
    font-size:27px;
    text-align:right;
    color:#111;
}

.keys{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.keys button{
    height:48px;
    border:0;
    border-radius:9px;
    background:#444;
    color:white;
    font-size:19px;
    cursor:pointer;
}

.keys button:active{
    transform:scale(.95);
}

.keys .operator{
    background:#48b8b2;
}

.keys .clear{
    background:#b73f4d;
}

.keys .equals{
    background:#48b8b2;
}

/* =========================
   TEST AREA
========================= */

.test-area{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:80px;
}

/* =========================
   HIPPO
========================= */

.hippo-area{
    width:280px;
    height:120px;
    position:relative;
    overflow:hidden;
}

.hippo{
    position:absolute;
    left:100px;
    top:35px;
    font-size:48px;
    color:#b197fc;
}

/* =========================
   NUMBER LOADING
========================= */

.loading-block{
    width:280px;
    margin-top:25px;
    text-align:center;
}

.loading-title{
    font-size:18px;
    margin-bottom:8px;
}

.loading-numbers{
    font-family:Arial,sans-serif;
    font-size:25px;
    letter-spacing:3px;
    height:32px;
}

/* =========================
   LOGO LOADING
========================= */

.logo-loading{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo-loading img{
    width:180px;
    height:auto;
    animation:breathe 1.7s ease-in-out infinite;
}

.logo-text{
    margin-top:8px;
    font-size:18px;
}

/* =========================
   SPINNING LOGO
========================= */

.spinner-block{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.spinning-logo{
    width:120px;
    height:auto;
    animation:spinLogo 1.5s linear infinite;
}

/* =========================
   SINGLE HOPPING HEART
========================= */

.heart-hop{
    margin-top:45px;
    height:65px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.heart-hop i{
    color:rgb(212,23,38);
    font-size:38px;
    animation:heartHop .7s ease-in-out infinite;
}

@keyframes heartHop{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-28px);
    }

}

/* =========================
   HEART MEXICAN WAVE
========================= */

.heart-wave{
    margin-top:35px;
    height:75px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:12px;
}

.wave-heart{
    color:rgb(212,23,38);
    font-size:30px;
    animation:waveHop .9s ease-in-out infinite;
}

.wave-heart:nth-child(1){
    animation-delay:0s;
}

.wave-heart:nth-child(2){
    animation-delay:.12s;
}

.wave-heart:nth-child(3){
    animation-delay:.24s;
}

.wave-heart:nth-child(4){
    animation-delay:.36s;
}

.wave-heart:nth-child(5){
    animation-delay:.48s;
}

.wave-heart:nth-child(6){
    animation-delay:.60s;
}

.wave-heart:nth-child(7){
    animation-delay:.72s;
}

@keyframes waveHop{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-32px);
    }

}

/* =========================
   MULTIPLE HEART CIRCLE
========================= */

.heart-circle{
    position:relative;
    width:190px;
    height:190px;
    margin-top:40px;
}

.circle-heart{
    position:absolute;
    inset:0;
    animation:circleSpin 3s linear infinite;
}

.circle-heart i{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    color:rgb(212,23,38);
    font-size:27px;
}

/* Rotate each heart's orbit */

.circle-heart:nth-child(2){
    animation-delay:-.5s;
}

.circle-heart:nth-child(3){
    animation-delay:-1s;
}

.circle-heart:nth-child(4){
    animation-delay:-1.5s;
}

.circle-heart:nth-child(5){
    animation-delay:-2s;
}

.circle-heart:nth-child(6){
    animation-delay:-2.5s;
}

@keyframes circleSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

/* =========================
   ANIMATIONS
========================= */

@keyframes breathe{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.13);
    }

}

@keyframes spinLogo{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .calc-button{
        left:10px;
        width:52px;
        height:52px;
        font-size:22px;
    }

    .calculator{
        left:10px;
        width:245px;
    }

    .test-area{
        padding-top:60px;
    }

    .hippo-area{
        width:240px;
    }

    .logo-loading img{
        width:155px;
    }

    .spinning-logo{
        width:105px;
    }

    .heart-wave{
        gap:8px;
    }

    .wave-heart{
        font-size:25px;
    }

    .heart-circle{
        width:165px;
        height:165px;
    }

}

</style>
</head>

<body>
    <h1>test place for things i want to add</h1>
    <p> i want to add a calcualtor in the lessons so u can do the lessons anywhere in the carb counting lessons 
    and a loading intro for when i mak ethis a mobile app</p>

<button class="calc-button" id="calcButton">
    <i class="fa-solid fa-calculator"></i>
</button>

<div class="calculator" id="calculator">

    <input
        class="display"
        id="display"
        readonly
    >

    <div class="keys">

        <button class="clear" onclick="clearCalc()">C</button>
        <button onclick="backspace()">⌫</button>
        <button onclick="addValue('(')">(</button>
        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button onclick="addValue(')')">)</button>
        <button class="equals" onclick="calculate()">=</button>

    </div>

</div>

<div class="test-area">

    <!-- HIPPO -->

    <div class="hippo-area">

        <div class="hippo" id="hippo">
            <i class="fa-solid fa-hippo"></i>
        </div>

    </div>

    <!-- NUMBER LOADING -->

    <div class="loading-block">

        <div class="loading-title">
            Loading
        </div>

        <div
            class="loading-numbers"
            id="loadingNumbers"
        >
            0000000000
        </div>

    </div>

    <!-- LOGO LOADING -->

    <div class="logo-loading">

        <img
            src="home/title.png"
            alt="Learn Diabetes"
        >

        <div
            class="logo-text"
            id="logoLoading"
        >
            Loading.
        </div>

    </div>

    <!-- SPINNING LOGO -->

    <div class="spinner-block">

        <img
            class="spinning-logo"
            src="home/title.png"
            alt="Learn Diabetes"
        >

    </div>

    <!-- SINGLE HOPPING HEART -->

    <div class="heart-hop">

        <i class="fa-solid fa-heart"></i>

    </div>

    <!-- HEART MEXICAN WAVE -->

    <div class="heart-wave">

        <i class="fa-solid fa-heart wave-heart"></i>
        <i class="fa-solid fa-heart wave-heart"></i>
        <i class="fa-solid fa-heart wave-heart"></i>
        <i class="fa-solid fa-heart wave-heart"></i>
        <i class="fa-solid fa-heart wave-heart"></i>
        <i class="fa-solid fa-heart wave-heart"></i>
        <i class="fa-solid fa-heart wave-heart"></i>

    </div>

    <!-- MULTIPLE HEARTS SPINNING IN A CIRCLE -->

    <div class="heart-circle">

        <div class="circle-heart">
            <i class="fa-solid fa-heart"></i>
        </div>

        <div class="circle-heart">
            <i class="fa-solid fa-heart"></i>
        </div>

        <div class="circle-heart">
            <i class="fa-solid fa-heart"></i>
        </div>

        <div class="circle-heart">
            <i class="fa-solid fa-heart"></i>
        </div>

        <div class="circle-heart">
            <i class="fa-solid fa-heart"></i>
        </div>

        <div class="circle-heart">
            <i class="fa-solid fa-heart"></i>
        </div>

    </div>

</div>

<script>

/* =========================
   CALCULATOR
========================= */

const calcButton =
    document.getElementById("calcButton");

const calculator =
    document.getElementById("calculator");

const display =
    document.getElementById("display");

calcButton.onclick=function(){

    if(calculator.style.display==="block"){
        calculator.style.display="none";
    }else{
        calculator.style.display="block";
    }

};

function addValue(value){

    if(display.value==="Error"){
        display.value="";
    }

    display.value+=value;

}

function clearCalc(){
    display.value="";
}

function backspace(){

    display.value=
        display.value.slice(0,-1);

}

function calculate(){

    try{

        const result=
            Function(
                '"use strict";return ('+
                display.value+
                ')'
            )();

        if(
            typeof result==="number" &&
            isFinite(result)
        ){

            display.value=
                Math.round(
                    result*100000
                )/100000;

        }else{

            display.value="Error";

        }

    }catch{

        display.value="Error";

    }

}

/* =========================
   DRAG CALCULATOR
========================= */

let dragging=false;
let offsetX=0;
let offsetY=0;

calculator.addEventListener(
    "mousedown",
    function(e){

        if(
            e.target.closest("button") ||
            e.target===display
        ){
            return;
        }

        dragging=true;

        const rect=
            calculator.getBoundingClientRect();

        offsetX=
            e.clientX-rect.left;

        offsetY=
            e.clientY-rect.top;

        calculator.style.transform="none";

        calculator.classList.add("dragging");

    }
);

document.addEventListener(
    "mousemove",
    function(e){

        if(!dragging)return;

        let x=
            e.clientX-offsetX;

        let y=
            e.clientY-offsetY;

        const maxX=
            window.innerWidth-
            calculator.offsetWidth;

        const maxY=
            window.innerHeight-
            calculator.offsetHeight;

        x=Math.max(0,Math.min(x,maxX));
        y=Math.max(0,Math.min(y,maxY));

        calculator.style.left=x+"px";
        calculator.style.top=y+"px";

    }
);

document.addEventListener(
    "mouseup",
    function(){

        dragging=false;

        calculator.classList.remove("dragging");

    }
);

/* TOUCH DRAGGING */

calculator.addEventListener(
    "touchstart",
    function(e){

        if(
            e.target.closest("button") ||
            e.target===display
        ){
            return;
        }

        const touch=e.touches[0];
        const rect=calculator.getBoundingClientRect();

        dragging=true;

        offsetX=
            touch.clientX-rect.left;

        offsetY=
            touch.clientY-rect.top;

        calculator.style.transform="none";

    },
    {passive:true}
);

document.addEventListener(
    "touchmove",
    function(e){

        if(!dragging)return;

        const touch=e.touches[0];

        let x=
            touch.clientX-offsetX;

        let y=
            touch.clientY-offsetY;

        const maxX=
            window.innerWidth-
            calculator.offsetWidth;

        const maxY=
            window.innerHeight-
            calculator.offsetHeight;

        x=Math.max(0,Math.min(x,maxX));
        y=Math.max(0,Math.min(y,maxY));

        calculator.style.left=x+"px";
        calculator.style.top=y+"px";

    },
    {passive:true}
);

document.addEventListener(
    "touchend",
    function(){
        dragging=false;
    }
);

/* =========================
   HIPPO
========================= */

const hippo=
    document.getElementById("hippo");

let hippoX=100;
let direction=1;

function moveHippo(){

    hippoX+=direction*0.7;

    if(hippoX>=180){

        direction=-1;

        hippo.style.transform=
            "scaleX(-1)";

    }

    if(hippoX<=25){

        direction=1;

        hippo.style.transform=
            "scaleX(1)";

    }

    hippo.style.left=
        hippoX+"px";

    requestAnimationFrame(moveHippo);

}

moveHippo();

/* =========================
   NUMBER LOADING
========================= */

const loadingNumbers=
    document.getElementById(
        "loadingNumbers"
    );

let zeros=10;

setInterval(function(){

    zeros--;

    if(zeros<0){
        zeros=10;
    }

    loadingNumbers.textContent=
        "0".repeat(zeros);

},180);

/* =========================
   DOT LOADING
========================= */

const logoLoading=
    document.getElementById(
        "logoLoading"
    );

let dots=1;

setInterval(function(){

    dots++;

    if(dots>3){
        dots=1;
    }

    logoLoading.textContent=
        "Loading"+
        ".".repeat(dots);

},500);

</script>

</body>
</html>
