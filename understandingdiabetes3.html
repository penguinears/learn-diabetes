<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Type 1 vs Type 2</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}
body{
  font-family:"Comic Sans MS","Comic Sans",Arial,sans-serif;
  background:#f7f5fb;
  color:#29233a;
}
.topbar{
  height:55px;
  flex-shrink:0;
  background:white;
  display:flex;
  align-items:center;
  padding:0 12px;
}
.back{
  color:#555;
  text-decoration:none;
  font-size:16px;
}
.progress-wrap{
  width:50%;
  height:8px;
  background:#eee;
  margin:auto;
  border-radius:10px;
  overflow:hidden;
}
.progress{
  height:100%;
  width:0;
  background:#6c3fc5;
  border-radius:10px;
  transition:width .25s ease;
}
.lesson{
  height:calc(100dvh - 55px);
  max-width:850px;
  margin:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:stretch;
}
.card{
  width:100%;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:white;
  display:flex;
  flex-direction:column;
  padding:8px;
  text-align:center;
}
#videoScreen,#quiz,#complete{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:auto;
  gap:10px;
}
#quiz,#complete{display:none}
h1{
  margin:0 0 12px;
  color:#29233a;
  font-size:25px;
}
.video{
  width:100%;
  height:min(55vh,450px);
  object-fit:contain;
  background:#000;
  display:block;
}
.continue,.check{
  border:0;
  background:#6c3fc5;
  color:white;
  font-family:inherit;
  font-size:18px;
  font-weight:bold;
  padding:11px 28px;
  border-radius:7px;
  cursor:pointer;
  margin-top:8px;
}
.continue:hover,.check:hover{background:#51309b}
.question{
  width:95%;
  max-width:650px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin-bottom:12px;
  line-height:1.3;
}
.answers{
  width:90%;
  max-width:500px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.answer{
  width:100%;
  padding:13px 12px;
  font-size:18px;
  text-align:center;
  border:0;
  border-radius:8px;
  background:#6c3fc5;
  color:white;
  font-family:inherit;
  font-weight:bold;
  cursor:pointer;
  transition:transform .12s;
}
.answer.selected{transform:scale(1.03)}
.answer:hover{background:#51309b}
.feedback{
  display:block;
  min-height:24px;
  text-align:center;
  padding:8px;
  font-size:18px;
  font-weight:bold;
}
.feedback.correct{color:#1b5e20}
.feedback.wrong{color:#b00020}
.complete-title{
  color:#6c3fc5;
  font-size:30px;
  margin-bottom:8px;
}
.complete-text{
  font-size:19px;
  line-height:1.5;
  margin:0 auto 12px;
  max-width:650px;
}
@media(max-width:600px){
  .lesson{padding:5px}
  .video{height:min(42vh,280px)}
  h1{font-size:22px}
  .question{font-size:20px}
  .answer{padding:11px;font-size:17px}
  .continue,.check{padding:10px 24px}
}
</style>
</head>

<body>

<div class="topbar">

  <a href="../index.html" class="back">Back</a>

  <div class="progress-wrap">
    <div class="progress" id="progress"></div>
  </div>

</div>


<div class="lesson">

  <div class="card">

    <!-- VIDEO -->

    <div id="videoScreen">

      <h1>Type 1 vs Type 2</h1>

      <video
        class="video"
        controls
        playsinline
        preload="metadata">

        <source src="videos/1004.mp4" type="video/mp4">

      </video>

      <button class="continue" onclick="startQuiz()">
        Continue
      </button>

    </div>


    <!-- QUIZ -->

    <div id="quiz">

      <h1>Type 1 vs Type 2</h1>

      <div class="question" id="question"></div>

      <div class="answers" id="answers"></div>

      <div class="feedback" id="feedback"></div>

      <button
        class="check"
        id="check"
        onclick="checkAnswer()">

        Check

      </button>

    </div>


    <!-- COMPLETE -->

    <div id="complete">

      <div class="complete-title">
        Lesson complete!
      </div>

      <p class="complete-text">
        You now know the difference between Type 1 and Type 2 diabetes.
      </p>

      <button
        class="continue"
        onclick="location.reload()">

        Do it again

      </button>

    </div>

  </div>

</div>


<script>

const questions = [

  {
    question:"What happens in Type 1 diabetes?",
    answers:[
      "The immune system attacks the cells that make insulin",
      "The body makes too much insulin",
      "The body stops using glucose"
    ],
    correct:0
  },

  {
    question:"What happens in Type 2 diabetes?",
    answers:[
      "The body cannot make glucose",
      "The body does not use insulin properly",
      "The immune system destroys all the body's cells"
    ],
    correct:1
  },

  {
    question:"Do people with Type 1 diabetes need insulin?",
    answers:[
      "Yes",
      "No",
      "Only sometimes"
    ],
    correct:0
  },

  {
    question:"Can Type 2 diabetes sometimes go into remission?",
    answers:[
      "Yes",
      "No",
      "Never"
    ],
    correct:0
  },

  {
    question:"Is Type 1 diabetes caused by eating too much sugar?",
    answers:[
      "Yes",
      "No",
      "Only in children"
    ],
    correct:1
  }

];


let current=0;
let selected=null;
let answered=false;


function updateProgress(){

  const total=questions.length+1;

  const position=current+1;

  document.getElementById("progress").style.width=
    ((position/total)*100)+"%";

}


function startQuiz(){

  document.getElementById("videoScreen").style.display="none";
  document.getElementById("quiz").style.display="block";

  current=0;

  updateProgress();
  loadQuestion();

}


function loadQuestion(){

  selected=null;
  answered=false;

  const q=questions[current];

  document.getElementById("question").textContent=q.question;

  const answers=document.getElementById("answers");

  answers.innerHTML="";

  document.getElementById("feedback").textContent="";

  document.getElementById("feedback").className="feedback";

  document.getElementById("check").style.display="inline-block";


  q.answers.forEach((answer,index)=>{

    const button=document.createElement("button");

    button.className="answer";

    button.textContent=answer;

    button.onclick=function(){

      if(answered) return;

      selected=index;

      document.querySelectorAll(".answer").forEach(b=>{
        b.classList.remove("selected");
      });

      button.classList.add("selected");

    };

    answers.appendChild(button);

  });

}


function checkAnswer(){

  if(selected===null) return;

  if(answered) return;

  const q=questions[current];

  const feedback=document.getElementById("feedback");

  if(selected===q.correct){

    answered=true;

    feedback.textContent="Correct!";

    feedback.className="feedback correct";

    document.getElementById("check").textContent=
      current===questions.length-1 ? "Finish" : "Continue";

    document.getElementById("check").onclick=nextQuestion;

  }else{

    feedback.textContent="Not right. Try again.";

    feedback.className="feedback wrong";

  }

}


function nextQuestion(){

  current++;

  if(current>=questions.length){

    document.getElementById("quiz").style.display="none";
    document.getElementById("complete").style.display="block";

    document.getElementById("progress").style.width="100%";

    return;

  }

  document.getElementById("check").textContent="Check";

  document.getElementById("check").onclick=checkAnswer;

  updateProgress();

  loadQuestion();

}

</script>

</body>
</html>
