<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Eating Out</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f5fb;
  color:#29233a;
}

.top{
  height:55px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 12px;
}

.back{
  color:#555;
  text-decoration:none;
}

.bar{
  width:50%;
  height:8px;
  background:#eee;
  margin:auto;
  border-radius:10px;
}

.progress{
  height:100%;
  width:0;
  background:#6c3fc5;
  border-radius:10px;
}

.page{
  height:calc(100dvh - 55px);
  max-width:850px;
  margin:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
}

.card{
  background:white;
  flex:1;
  min-height:0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:8px;
}

.img{
  width:100%;
  height:min(50vh,380px);
  object-fit:contain;
  user-select:none;
}

.pool{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:auto;
}

.answer{
  width:90%;
  max-width:400px;
  padding:10px;
  font-size:18px;
  text-align:center;
  border:2px solid #6c3fc5;
  border-radius:7px;
  outline:none;
}

.feedback{
  display:none;
  text-align:center;
  padding:8px;
}

.feedback.red{
  color:#b00020;
}

.feedback.yellow{
  color:#8a6d1b;
}

.feedback.green{
  color:#1b5e20;
}

.controls{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
}

button{
  font:inherit;
  cursor:pointer;
}

.mainbtn{
  border:0;
  background:#6c3fc5;
  color:white;
  font-weight:bold;
  padding:11px 28px;
  border-radius:7px;
}

.complete{
  position:fixed;
  inset:0;
  background:#f7f5fb;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

@media(max-width:600px){
  .page{
    padding:5px;
  }

  .img{
    height:min(40vh,260px);
  }

  .mainbtn{
    padding:10px 24px;
  }
}
</style>
</head>

<body>

<header class="top">
  <a class="back" href="../index.html">Back</a>

  <div class="bar">
    <div class="progress" id="progress"></div>
  </div>
</header>

<main class="page" id="lesson">

  <div class="card">

    <img
      id="img"
      class="img"
      draggable="false"
      alt=""
    >

    <div id="pool" class="pool"></div>

    <div id="feedback" class="feedback"></div>

  </div>

  <div class="controls">

    <button
      id="continue"
      class="mainbtn">
      Continue
    </button>

    <button
      id="check"
      class="mainbtn"
      style="display:none">
      Check
    </button>

  </div>

</main>

<section
  id="complete"
  class="complete"
  style="display:none">

  <div>
    <h1>Lesson complete</h1>
    <p>Great work!</p>
  </div>

</section>

<script>

const lessons = [

  {
    type:"image",
    image:"eatingout/38.jpg"
  },

  {
    type:"calc",
    image:"eatingout/39.jpg",
    answer:20.5
  },

  {
    type:"calc",
    image:"eatingout/40.jpg",
    answer:51.52
  },

  {
    type:"calc",
    image:"eatingout/41.jpg",
    answer:43.65
  },

  {
    type:"image",
    image:"eatingout/42.jpg"
  }

];

let n = 0;
let locked = false;

const $ = id => document.getElementById(id);

function load(){

  locked = false;

  $("feedback").style.display = "none";
  $("feedback").textContent = "";

  $("progress").style.width =
    (n / lessons.length * 100) + "%";

  $("img").src = lessons[n].image;

  $("pool").innerHTML = "";

  $("continue").style.display = "block";
  $("check").style.display = "none";

  if(lessons[n].type === "calc"){

    loadCalc();

    $("continue").style.display = "none";
    $("check").style.display = "block";

  }

}

function loadCalc(){

  let input = document.createElement("input");

  input.type = "number";
  input.step = "0.01";
  input.inputMode = "decimal";
  input.placeholder = "Enter answer";
  input.className = "answer";
  input.id = "answerBox";

  $("pool").appendChild(input);

  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      $("check").click();
    }
  });

}

$("check").onclick = () => {

  if(locked)
    return;

  let x = lessons[n];

  if(x.type === "calc"){

    let value =
      parseFloat($("answerBox").value);

    if(isNaN(value)){

      showFeedback(
        "yellow",
        "Enter a number."
      );

      return;
    }

    if(
      Math.abs(value - x.answer) < 0.01
    ){

      correctAdvance();

    }else{

      showFeedback(
        "red",
        "Not right. Try again."
      );

    }

  }

};

function showFeedback(type,text){

  $("feedback").className =
    "feedback " + type;

  $("feedback").textContent = text;

  $("feedback").style.display = "block";

}

function correctAdvance(){

  locked = true;

  showFeedback(
    "green",
    "Correct!"
  );

  setTimeout(() => {

    n++;

    if(n >= lessons.length){

      finish();
      return;

    }

    load();

  },600);

}

$("continue").onclick = () => {

  if(locked)
    return;

  n++;

  if(n >= lessons.length){

    finish();
    return;

  }

  load();

};

function finish(){

  $("lesson").style.display = "none";

  $("complete").style.display = "flex";

  $("progress").style.width = "100%";

}

load();

</script>

<script src="calculator.js"></script>

</body>
</html>
