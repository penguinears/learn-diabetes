<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carb Counting</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: white;
    color: #222;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
}

.banner {
    height: 85px;
    background: #7b4bb7;
    display: flex;
    align-items: center;
    padding-left: 18px;
}

.banner img {
    height: 62px;
    width: auto;
}

.page {
    max-width: 600px;
    margin: 28px auto;
    padding: 0 20px 50px;
}

h1 {
    font-size: 30px;
    margin: 0 0 8px;
}

.intro {
    font-size: 16px;
    color: #666;
    margin: 0 0 18px;
}

.progress-text {
    font-size: 14px;
    margin-bottom: 7px;
}

.progress {
    width: 100%;
    height: 10px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 35px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #7b4bb7;
}

.trail {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
}

.lesson {
    width: 100%;
    display: flex;
    align-items: center;
}

.lesson.left {
    justify-content: flex-start;
    padding-left: 15%;
}

.lesson.right {
    justify-content: flex-end;
    padding-right: 15%;
}

.level-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 190px;
}

.level {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #7b4bb7;
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 4px 0 #5f3790;
    transition: .15s;
}

.level:hover {
    transform: translateY(-3px);
}

.lesson-name {
    text-align: center;
    margin-top: 9px;
    font-size: 15px;
    line-height: 1.2;
    font-weight: bold;
}

.final {
    background: #e4b83e;
    box-shadow: 0 4px 0 #b18b20;
}

@media (max-width: 600px) {

    .banner {
        height: 70px;
        padding-left: 12px;
    }

    .banner img {
        height: 50px;
    }

    .page {
        margin-top: 22px;
        padding-left: 15px;
        padding-right: 15px;
    }

    .lesson.left {
        padding-left: 5%;
    }

    .lesson.right {
        padding-right: 5%;
    }

    .level-box {
        width: 170px;
    }
}
</style>
</head>

<body>

<div class="banner">
    <img src="home/title.png" alt="Learn Diabetes">
</div>

<div class="page">

    <h1>Carb Counting:</h1>

    <p class="intro">
        Learn how to understand and count carbohydrates.
    </p>

    <div class="progress-text">0 / 8 completed</div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="trail">

        <div class="lesson left">
            <div class="level-box">
                <a class="level" href="carbcounting1.html">1</a>
                <div class="lesson-name">Spotting<br>Carbohydrates</div>
            </div>
        </div>

        <div class="lesson right">
            <div class="level-box">
                <a class="level" href="carbcounting2.html">2</a>
                <div class="lesson-name">Using Food<br>Labels</div>
            </div>
        </div>

        <div class="lesson left">
            <div class="level-box">
                <a class="level" href="carbcounting3.html">3</a>
                <div class="lesson-name">Weighing<br>Food 1</div>
            </div>
        </div>

        <div class="lesson right">
            <div class="level-box">
                <a class="level" href="carbcounting4.html">4</a>
                <div class="lesson-name">Weighing<br>Food 2</div>
            </div>
        </div>

        <div class="lesson left">
            <div class="level-box">
                <a class="level" href="carbcounting5.html">5</a>
                <div class="lesson-name">Drinks &amp;<br>Hidden Carbs</div>
            </div>
        </div>

        <div class="lesson right">
            <div class="level-box">
                <a class="level" href="carbcounting6.html">6</a>
                <div class="lesson-name">Eating Out</div>
            </div>
        </div>

        <div class="lesson left">
            <div class="level-box">
                <a class="level" href="carbcounting7.html">7</a>
                <div class="lesson-name">Building<br>a Meal</div>
            </div>
        </div>

        <div class="lesson right">
            <div class="level-box">
                <a class="level final" href="carbcounting8.html">8</a>
                <div class="lesson-name">Final<br>Challenge</div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
