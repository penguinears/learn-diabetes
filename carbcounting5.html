<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Drinks & Hidden Carbs</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
box-sizing:border-box
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
touch-action:manipulation;
}

body{
font-family:Arial,sans-serif;
background:#f7f5fb;
color:#29233a;
}

.top{
height:55px;
background:white;
display:flex;
align-items:center;
padding:0 12px;
}

.back{
color:#555;
text-decoration:none;
}

.bar{
width:50%;
height:8px;
background:#eee;
margin:auto;
border-radius:10px;
}

.progress{
height:100%;
width:0;
background:#6c3fc5;
border-radius:10px;
}

.page{
height:calc(100dvh - 55px);
max-width:850px;
margin:auto;
padding:8px;
display:flex;
flex-direction:column;
}

.card{
background:white;
flex:1;
min-height:0;
overflow:hidden;
display:flex;
flex-direction:column;
padding:8px;
}

.img{
width:100%;
height:min(50vh,380px);
object-fit:contain;
user-select:none;
}

.pool{
flex:1;
min-height:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:auto;
}

.sort-area{
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.sort-box{
min-height:120px;
padding:8px;
text-align:center;
background:#f3f3f3;
}

.sort-title{
font-weight:bold;
margin-bottom:8px;
font-size:15px;
}

.drinks{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:8px;
margin-top:12px;
}

.drink{
background:#eee;
padding:10px 15px;
cursor:grab;
user-select:none;
touch-action:none;
}

.drink.dragging{
opacity:.4;
}

.sort-box.over{
background:#e9e2ff;
}

.answer{
width:90%;
max-width:400px;
padding:10px;
font-size:18px;
text-align:center;
border:2px solid #6c3fc5;
border-radius:7px;
outline:none;
}

.feedback{
display:none;
text-align:center;
padding:8px;
}

.feedback.red{
color:#b00020;
}

.feedback.yellow{
color:#8a6d1b;
}

.feedback.green{
color:#1b5e20;
}

.controls{
height:58px;
display:flex;
align-items:center;
justify-content:center;
}

button{
font:inherit;
cursor:pointer;
}

.mainbtn{
border:0;
background:#6c3fc5;
color:white;
font-weight:bold;
padding:11px 28px;
border-radius:7px;
}

.complete{
position:fixed;
inset:0;
background:#f7f5fb;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

@media(max-width:600px){

.page{
padding:5px;
}

.img{
height:min(40vh,260px);
}

.sort-area{
gap:8px;
}

.sort-box{
min-height:100px;
}

.drinks{
width:100%;
}

.drink{
width:45%;
text-align:center;
padding:9px;
}

.mainbtn{
padding:10px 24px;
}

}
</style>
</head>

<body>

<header class="top">

<a class="back" href="../index.html">Back</a>

<div class="bar">
<div class="progress" id="progress"></div>
</div>

</header>


<main class="page" id="lesson">

<div class="card">

<img
id="img"
class="img"
draggable="false"
>

<div
id="pool"
class="pool">
</div>

<div
id="feedback"
class="feedback">
</div>

</div>


<div class="controls">

<button
id="continue"
class="mainbtn">
Continue
</button>

<button
id="check"
class="mainbtn"
style="display:none">
Check
</button>

</div>

</main>


<section
id="complete"
class="complete"
style="display:none">

<div>
<h1>Lesson complete</h1>
<p>Great work!</p>
</div>

</section>


<script>

const lessons=[

{
type:"image",
image:"carbcount4/28.jpg"
},

{
type:"sort",
image:"carbcount4/29.jpg"
},

{
type:"image",
image:"carbcount4/30.jpg"
},

{
type:"calc",
image:"carbcount4/31.jpg",
answer:8.25
},

{
type:"calc",
image:"carbcount4/32.jpg",
answer:3.6
},

{
type:"calc",
image:"carbcount4/33.jpg",
answer:5.025
},

{
type:"calc",
image:"carbcount4/34.jpg",
answer:5.625
},

{
type:"calc",
image:"carbcount4/35.jpg",
answer:0
},

{
type:"image",
image:"carbcount4/36.jpg"
}

];


let n=0;
let locked=false;

const $=id=>document.getElementById(id);


function load(){

locked=false;

$("feedback").style.display="none";
$("feedback").textContent="";

$("progress").style.width=
(n/lessons.length*100)+"%";

$("img").src=lessons[n].image;

$("pool").innerHTML="";

$("continue").style.display="block";
$("check").style.display="none";


if(lessons[n].type==="sort"){

loadSort();

$("continue").style.display="none";
$("check").style.display="block";

}


if(lessons[n].type==="calc"){

loadCalc();

$("continue").style.display="none";
$("check").style.display="block";

}

}


function loadSort(){

let area=document.createElement("div");

area.className="sort-area";


let low=document.createElement("div");

low.className="sort-box";
low.dataset.answer="low";

let lowTitle=document.createElement("div");

lowTitle.className="sort-title";
lowTitle.textContent="Little to no carbs";

low.appendChild(lowTitle);


let high=document.createElement("div");

high.className="sort-box";
high.dataset.answer="high";

let highTitle=document.createElement("div");

highTitle.className="sort-title";
highTitle.textContent="High in carbs";

high.appendChild(highTitle);


area.appendChild(low);
area.appendChild(high);

$("pool").appendChild(area);


let drinks=document.createElement("div");

drinks.className="drinks";


const items=[

{
name:"Dr Pepper",
answer:"high"
},

{
name:"Oat milk",
answer:"high"
},

{
name:"Sprite Zero",
answer:"low"
},

{
name:"Water",
answer:"low"
}

];


items.forEach(item=>{

let d=document.createElement("div");

d.className="drink";

d.textContent=item.name;

d.draggable=true;

d.dataset.answer=item.answer;


/* PC DRAG */

d.addEventListener(
"dragstart",
e=>{

e.dataTransfer.setData(
"text/plain",
""
);

d.classList.add("dragging");

}
);


d.addEventListener(
"dragend",
()=>{

d.classList.remove("dragging");

}
);


/* MOBILE DRAG */

let clone=null;
let startX=0;
let startY=0;


d.addEventListener(
"pointerdown",
e=>{

if(e.pointerType==="mouse")
return;

startX=e.clientX;
startY=e.clientY;

d.setPointerCapture(
e.pointerId
);

}
);


d.addEventListener(
"pointermove",
e=>{

if(e.pointerType==="mouse")
return;

if(!d.hasPointerCapture(
e.pointerId
))
return;


let dx=e.clientX-startX;
let dy=e.clientY-startY;


if(!clone){

if(Math.sqrt(
dx*dx+dy*dy
)<8)
return;


clone=d.cloneNode(true);

clone.style.position="fixed";
clone.style.zIndex="9999";
clone.style.pointerEvents="none";
clone.style.width=d.offsetWidth+"px";
clone.style.opacity=".7";

document.body.appendChild(
clone
);

d.style.opacity=".4";

}


clone.style.left=
(e.clientX-d.offsetWidth/2)+"px";

clone.style.top=
(e.clientY-d.offsetHeight/2)+"px";

}
);


d.addEventListener(
"pointerup",
e=>{

if(e.pointerType==="mouse")
return;

if(!clone)
return;


let target=
document.elementFromPoint(
e.clientX,
e.clientY
);

let box=
target?.closest(
".sort-box"
);


if(box){

box.appendChild(d);

}


clone.remove();

clone=null;

d.style.opacity="1";

}
);


drinks.appendChild(d);

});


$("pool").appendChild(drinks);


/* PC DROP */

document.querySelectorAll(
".sort-box"
).forEach(box=>{

box.addEventListener(
"dragover",
e=>{

e.preventDefault();

box.classList.add("over");

}
);


box.addEventListener(
"dragleave",
()=>{

box.classList.remove("over");

}
);


box.addEventListener(
"drop",
e=>{

e.preventDefault();

box.classList.remove("over");


let d=
document.querySelector(
".drink.dragging"
);


if(d){

box.appendChild(d);

}

}
);

});

}


function loadCalc(){

let input=
document.createElement("input");

input.type="number";

input.step="0.001";

input.inputMode="decimal";

input.placeholder="Enter answer";

input.className="answer";

input.id="answerBox";

$("pool").appendChild(
input
);

}


$("check").onclick=()=>{

if(locked)
return;


let x=lessons[n];


/* SORT */

if(x.type==="sort"){

let correct=true;

let boxes=
document.querySelectorAll(
".sort-box"
);


boxes.forEach(box=>{

box.querySelectorAll(
".drink"
).forEach(drink=>{

if(
drink.dataset.answer
!==box.dataset.answer
){

correct=false;

}

});

});


if(
document.querySelectorAll(
".sort-box .drink"
).length!==4
){

correct=false;

}


if(correct){

correctAdvance();

}else{

showFeedback(
"red",
"Not quite. Try again."
);

}

return;

}


/* CALC */

if(x.type==="calc"){

let value=
parseFloat(
$("answerBox").value
);


if(isNaN(value)){

showFeedback(
"yellow",
"Enter a number."
);

return;

}


if(
Math.abs(
value-x.answer
)<0.01
){

correctAdvance();

}else{

showFeedback(
"red",
"Not right. Try again."
);

}

}

};


function showFeedback(
type,
text
){

$("feedback").className=
"feedback "+type;

$("feedback").textContent=
text;

$("feedback").style.display=
"block";

}


function correctAdvance(){

locked=true;

showFeedback(
"green",
"Correct!"
);


setTimeout(()=>{

n++;

if(
n>=lessons.length
){

finish();

return;

}

load();

},600);

}


$("continue").onclick=()=>{

if(locked)
return;

n++;

if(
n>=lessons.length
){

finish();

return;

}

load();

};


function finish(){

$("lesson").style.display=
"none";

$("complete").style.display=
"flex";

$("progress").style.width=
"100%";

}


load();

</script>

</body>
</html>
