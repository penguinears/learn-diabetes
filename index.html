<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carb Counting 2</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --purple: #6c3fc5;
    --purple-dark: #51309b;
    --purple-light: #f0eaff;
    --purple-border: #d8c9f5;
    --green: #58b947;
    --text: #29233a;
    --muted: #716b7d;
    --border: #e2dfe8;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f5fb;
    color: var(--text);
    overflow: hidden;
}

/* TOP */

.topbar {
    height: 58px;
    background: white;
    border-bottom: 1px solid #e8e4ee;
    display: flex;
    align-items: center;
    padding: 0 16px;
    flex-shrink: 0;
}

.back {
    text-decoration: none;
    color: #625b70;
    font-size: 15px;
    font-weight: bold;
    padding: 8px 10px;
    border-radius: 8px;
    white-space: nowrap;
}

.back:hover {
    background: var(--purple-light);
    color: var(--purple);
}

.progress-wrap {
    width: 420px;
    max-width: 58vw;
    margin: auto;
}

.progress-bg {
    height: 9px;
    background: #e7e3ec;
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    width: 0%;
    height: 100%;
    background: var(--purple);
    border-radius: 20px;
    transition: width .45s ease;
}

/* PAGE */

.page {
    height: calc(100vh - 58px);
    height: calc(100dvh - 58px);
    max-width: 900px;
    margin: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.header {
    text-align: center;
    flex-shrink: 0;
}

.header small {
    color: var(--purple);
    font-size: 12px;
    font-weight: bold;
}

.header h1 {
    font-size: 25px;
    line-height: 1.15;
    margin: 4px 0;
    font-weight: 800;
}

.header p {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 8px;
}

/* CARD */

.card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 #e5e0ec;
    overflow: hidden;
}

/*
   The image is allowed to shrink to the exact
   amount of space available. This prevents the
   top or bottom of the image disappearing on phones.
*/

.lesson-image {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    flex: 1 1 auto;
    min-height: 0;
}

/* ANSWER */

.answer-area {
    display: none;
    flex: 0 0 auto;
    width: 100%;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
}

.answer-input {
    width: 170px;
    height: 46px;
    border: 2px solid #d8d3df;
    border-radius: 10px;
    background: white;
    color: var(--text);
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    outline: none;
}

.answer-input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px var(--purple-light);
}

.unit {
    font-size: 16px;
    font-weight: bold;
    color: #625b70;
}

/* FEEDBACK */

.feedback {
    display: none;
    flex: 0 0 auto;
    text-align: center;
    margin: 7px auto 0;
    padding: 7px 12px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: bold;
}

.feedback.green {
    display: block;
    background: #eaf8e7;
    border: 1px solid #a8d99e;
    color: #39742f;
}

.feedback.red {
    display: block;
    background: #fdeaea;
    border: 1px solid #dfa4a4;
    color: #862e2e;
}

/* BUTTONS */

.controls {
    height: 58px;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: center;
}

button {
    font-family: Arial, sans-serif;
    cursor: pointer;
}

.continue,
.check {
    border: none;
    background: var(--purple);
    color: white;
    font-weight: 800;
    padding: 11px 32px;
    border-radius: 10px;
    font-size: 15px;
    box-shadow: 0 3px 0 var(--purple-dark);
    transition: .1s;
}

.continue:hover,
.check:hover {
    background: #7950d0;
}

.continue:active,
.check:active {
    transform: translateY(3px);
    box-shadow: none;
}

/* COMPLETE */

.complete {
    display: none;
    width: 100%;
    height: calc(100vh - 58px);
    height: calc(100dvh - 58px);
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.complete-box {
    background: white;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 35px 25px;
    max-width: 550px;
    box-shadow: 0 4px 0 #e5e0ec;
}

.complete-box h1 {
    margin-top: 0;
    color: var(--purple);
    font-size: 29px;
}

.complete-box p {
    color: var(--muted);
    line-height: 1.5;
}

/* MOBILE */

@media (max-width: 650px) {

    .topbar {
        height: 54px;
        padding: 0 10px;
    }

    .progress-wrap {
        max-width: 52vw;
    }

    .page {
        height: calc(100vh - 54px);
        height: calc(100dvh - 54px);
        padding: 8px 9px;
    }

    .header small {
        font-size: 11px;
    }

    .header h1 {
        font-size: 20px;
        margin: 3px 0;
    }

    .header p {
        font-size: 12px;
        margin-bottom: 6px;
    }

    .card {
        padding: 7px;
        border-radius: 14px;
    }

    .lesson-image {
        max-height: 100%;
        max-width: 100%;
    }

    .answer-area {
        padding-top: 6px;
    }

    .answer-input {
        width: 145px;
        height: 43px;
        font-size: 18px;
    }

    .unit {
        font-size: 15px;
    }

    .feedback {
        margin-top: 5px;
        font-size: 12px;
        padding: 6px 10px;
    }

    .controls {
        height: 55px;
        flex-basis: 55px;
    }

    .continue,
    .check {
        padding: 10px 30px;
        font-size: 14px;
    }
}

/* VERY SMALL PHONES */

@media (max-height: 650px) and (max-width: 650px) {

    .page {
        padding-top: 5px;
    }

    .header h1 {
        font-size: 18px;
    }

    .header p {
        display: none;
    }

    .header small {
        font-size: 10px;
    }

    .controls {
        height: 48px;
        flex-basis: 48px;
    }

    .continue,
    .check {
        padding: 8px 27px;
        font-size: 13px;
    }

    .answer-input {
        height: 39px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <a href="../index.html" class="back">Back</a>

    <div class="progress-wrap">
        <div class="progress-bg">
            <div class="progress" id="progress"></div>
        </div>
    </div>

</header>


<main class="page" id="lesson">

    <div class="header">

        <small id="slideNumber">
            Slide 1 of 9
        </small>

        <h1 id="title">
            Carb Counting
        </h1>

        <p id="subtitle"></p>

    </div>


    <div class="card">

        <img
            class="lesson-image"
            id="lessonImage"
            src=""
            alt="Lesson"
        >

        <div
            class="answer-area"
            id="answerArea"
        >

            <input
                type="number"
                step="0.1"
                id="answerInput"
                class="answer-input"
                autocomplete="off"
            >

            <span class="unit">grams</span>

        </div>

        <div
            class="feedback"
            id="feedback"
        ></div>

    </div>


    <div class="controls">

        <button
            class="continue"
            id="continueButton"
        >
            Continue
        </button>

        <button
            class="check"
            id="checkButton"
            style="display:none;"
        >
            Check
        </button>

    </div>

</main>


<section
    class="complete"
    id="complete"
>

    <div class="complete-box">

        <h1>Level completed!</h1>

        <p>
            Great work. You have completed this level
            and practised calculating carbohydrate from
            food portions.
        </p>

    </div>

</section>


<script>

const slides = [

    {
        image: "carbcount2/4.jpg",
        type: "continue",
        title: "Using food labels"
    },

    {
        image: "carbcount2/5.jpg",
        type: "continue",
        title: "Calculating carbohydrate"
    },

    {
        image: "carbcount2/6.jpg",
        type: "question",
        answer: 45,
        title: "Calculate the carbohydrate"
    },

    {
        image: "carbcount2/7.jpg",
        type: "question",
        answer: 5,
        title: "Calculate the carbohydrate"
    },

    {
        image: "carbcount2/8.jpg",
        type: "question",
        answer: 90,
        title: "Calculate the carbohydrate"
    },

    {
        image: "carbcount2/9.jpg",
        type: "continue",
        title: "Quick tip"
    },

    {
        image: "carbcount2/10.jpg",
        type: "continue",
        title: "Method 2"
    },

    {
        image: "carbcount2/11.jpg",
        type: "question",
        answer: 20.4,
        title: "Calculate the carbohydrate"
    },

    {
        image: "carbcount2/12.jpg",
        type: "continue",
        title: "Quick tip"
    }

];


let currentSlide = 0;

const image =
    document.getElementById("lessonImage");

const slideNumber =
    document.getElementById("slideNumber");

const title =
    document.getElementById("title");

const answerArea =
    document.getElementById("answerArea");

const answerInput =
    document.getElementById("answerInput");

const feedback =
    document.getElementById("feedback");

const continueButton =
    document.getElementById("continueButton");

const checkButton =
    document.getElementById("checkButton");

const progress =
    document.getElementById("progress");

const lesson =
    document.getElementById("lesson");

const complete =
    document.getElementById("complete");


function loadSlide() {

    const slide = slides[currentSlide];

    image.src = slide.image;

    slideNumber.textContent =
        "Slide " +
        (currentSlide + 1) +
        " of " +
        slides.length;

    title.textContent =
        slide.title;

    answerInput.value = "";

    answerInput.disabled = false;

    feedback.className = "feedback";
    feedback.textContent = "";

    answerArea.style.display = "none";

    continueButton.style.display = "none";

    checkButton.style.display = "none";


    if (slide.type === "question") {

        answerArea.style.display = "flex";

        checkButton.style.display = "inline-block";

        setTimeout(function() {
            answerInput.focus();
        }, 100);

    } else {

        continueButton.style.display = "inline-block";

    }

    updateProgress();
}


function updateProgress() {

    const percentage =
        (currentSlide / slides.length) * 100;

    progress.style.width =
        percentage + "%";
}


function nextSlide() {

    currentSlide++;

    if (currentSlide >= slides.length) {

        finishLevel();

        return;
    }

    loadSlide();
}


continueButton.addEventListener(
    "click",
    function() {
        nextSlide();
    }
);


checkButton.addEventListener(
    "click",
    function() {

        const slide =
            slides[currentSlide];

        const value =
            parseFloat(answerInput.value);


        if (isNaN(value)) {

            feedback.className =
                "feedback red";

            feedback.textContent =
                "Enter an answer first.";

            return;
        }


        if (
            Math.abs(value - slide.answer) < 0.01
        ) {

            feedback.className =
                "feedback green";

            feedback.textContent =
                "Correct!";

            checkButton.style.display =
                "none";

            answerInput.disabled =
                true;


            setTimeout(
                function() {

                    answerInput.disabled =
                        false;

                    nextSlide();

                },
                700
            );

        }

        else {

            feedback.className =
                "feedback red";

            feedback.textContent =
                "Not quite. Try again.";

        }

    }
);


answerInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            checkButton.click();

        }

    }
);


function finishLevel() {

    progress.style.width = "100%";

    lesson.style.display = "none";

    complete.style.display = "flex";

}


loadSlide();

</script>

</body>
</html>
